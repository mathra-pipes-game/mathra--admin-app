name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get packages
        working-directory: mathra_admin
        run: flutter pub get

      - name: Build APK (with retries)
        working-directory: mathra_admin
        run: |
          for attempt in 1 2 3; do
            if flutter build apk --release; then
              exit 0
            fi
            echo "Attempt $attempt failed, retrying..."
            sleep $((attempt * 45))
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: mathra-admin-apk
          path: mathra_admin/build/app/outputs/flutter-apk/app-release.apk
